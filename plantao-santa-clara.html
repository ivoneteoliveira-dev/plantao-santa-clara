<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Plantão Santa Clara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: sinalização hospitalar — letreiros condensados, pulseira do paciente como objeto central, uma tarefa por tela, barra de abas embaixo */
:root{
  --bg:#E9EFEC; --card:#FFFFFF; --ink:#102A25; --muted:#55706A; --line:#C8D6D0;
  --teal:#0B7A64; --teal-ink:#FFFFFF; --teal-soft:#D3ECE3;
  --alert:#C93A2A; --alert-soft:#FBE2DD; --amber:#9A6500; --amber-soft:#FAEDCF; --band:#F6F8F7;
  --f-sign:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1916; --card:#14251F; --ink:#E2EEE9; --muted:#93AAA2; --line:#2A403A;
  --teal:#3CC29F; --teal-ink:#06231C; --teal-soft:#16382F;
  --alert:#FF6B57; --alert-soft:#3B1D18; --amber:#F0B543; --amber-soft:#3A2D12; --band:#101F1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1916; --card:#14251F; --ink:#E2EEE9; --muted:#93AAA2; --line:#2A403A;
  --teal:#3CC29F; --teal-ink:#06231C; --teal-soft:#16382F;
  --alert:#FF6B57; --alert-soft:#3B1D18; --amber:#F0B543; --amber-soft:#3A2D12; --band:#101F1B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-sign);font-weight:900;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:3px}
.clock{font-family:var(--f-mono);font-size:14px;font-weight:600;background:var(--ink);color:var(--card);padding:6px 10px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.view{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:600}
h1,h2,h3{font-family:var(--f-sign);font-weight:800;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(44px,13vw,64px)}
h2{font-size:34px}
h3{font-size:24px}
p{margin:0}
.lead{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}

.btn{appearance:none;border:0;border-radius:10px;padding:15px 18px;font-weight:700;font-size:16px;cursor:pointer;background:var(--teal);color:var(--teal-ink);width:100%;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--alert);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}

.sector{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--card);border-radius:10px;padding:12px 14px}
.sector .arrow{font-family:var(--f-sign);font-weight:900;font-size:30px;line-height:1}
.sector b{font-family:var(--f-sign);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.sector span{display:block;font-size:13px;opacity:.75}

.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--teal)}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.band{position:relative;background:var(--band);border:1.5px solid var(--line);border-radius:22px;padding:16px 18px 16px 58px;overflow:hidden}
.band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:42px;
  background:repeating-linear-gradient(0deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px);opacity:.85}
.band .pn{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.band .nm{font-family:var(--f-sign);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1;margin:4px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted);font-size:13px;align-self:center}
.kv dd{margin:0;font-family:var(--f-mono);font-size:14px;font-weight:600;min-width:0}
.allergy{display:inline-block;background:var(--alert);color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px}
.allergy.none{background:var(--line);color:var(--ink)}

.doc{background:var(--card);border:1.5px dashed var(--muted);border-radius:12px;padding:14px 16px}
.doc .pn{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:14px;cursor:pointer}
.opt.sel{border-color:var(--teal);background:var(--teal-soft);font-weight:600}
.opt.body{font-family:var(--f-body);font-size:16px}

.bubble{background:var(--amber-soft);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:16px}
.bubble small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--amber);font-weight:600;margin-bottom:2px}
.rx{border-left:5px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:12px 14px}
.rx small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.rx b{font-family:var(--f-mono);font-size:15px}
.alertbox{border:2px solid var(--alert);background:var(--alert-soft);border-radius:10px;padding:12px 14px;font-weight:700}
.alertbox small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--alert);margin-bottom:4px}
.noaccess{font-family:var(--f-mono);font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:6px 8px}

.screens{display:grid;grid-template-columns:1fr;gap:10px}
.screen{border:1.5px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;transition:opacity .3s}
.screen header{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--band);padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--f-sign);font-weight:800;text-transform:uppercase;font-size:18px;letter-spacing:.03em}
.screen header em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--teal);letter-spacing:.06em}
.screen .body{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.screen.fill .body{animation:fill .6s ease both}
@keyframes fill{from{background:var(--teal-soft)}to{background:transparent}}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-sign);font-weight:900;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.bad b{color:var(--alert)}
.stat.good b{color:var(--teal)}
.stat.warn b{color:var(--amber)}

.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.issues li{border-left:4px solid var(--alert);background:var(--card);padding:10px 12px;border-radius:6px;font-size:15px}
.issues li.div{border-color:var(--amber)}
.issues li.ok{border-color:var(--teal)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
.cmp tr:last-child td{border-bottom:0}
.cmp th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cmp .n{font-family:var(--f-mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* pontes */
.netwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
svg.net{width:100%;height:auto;display:block;max-height:340px}
.cash{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--card);border-radius:10px;padding:10px 14px}
.cash b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.cash span{font-size:13px;opacity:.8}
.pair{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:11px 12px;cursor:pointer;font-size:15px}
.pair .pr{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.pair.on{border-color:var(--teal);background:var(--teal-soft)}
.pair.on .pr{color:var(--teal);font-weight:600}
.pair.lock{opacity:.6;cursor:default}
.pair.brk{border-color:var(--alert);background:var(--alert-soft)}
.flows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.flows li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.flows .rt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:4px}
.chip.ok{background:var(--teal-soft);color:var(--teal)}
.chip.at{background:var(--amber-soft);color:var(--amber)}
.chip.fa{background:var(--alert-soft);color:var(--alert)}
input[type=range]{width:100%;accent-color:var(--teal)}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum b{font-family:var(--f-sign);font-weight:900;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.formula{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:7px;padding:10px 6px;font-weight:700;cursor:pointer;font-size:14px}
.seg button.on{background:var(--ink);color:var(--card)}

/* permissões */
.prow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.prow .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prow .ph b{font-family:var(--f-sign);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.prow .mark{font-family:var(--f-mono);font-size:12px;font-weight:600}
.prow.okr{border-color:var(--teal)}
.prow.okr .mark{color:var(--teal)}
.prow.bad{border-color:var(--alert)}
.prow.bad .mark{color:var(--alert)}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lvl button{appearance:none;border:1.5px solid var(--line);background:var(--band);border-radius:7px;padding:9px 4px;font-size:14px;font-weight:700;cursor:pointer}
.lvl button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.lvl button:disabled{cursor:default}
.why{font-size:14px;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:20;background:rgba(6,20,16,.6);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.modal .sheet{background:var(--card);border-radius:16px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;animation:up .25s ease}
.phone{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--amber);font-weight:600}
@keyframes up{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}

.feedback{border-radius:10px;padding:12px 14px;font-size:15px}
.feedback.ok{background:var(--teal-soft)}
.feedback.no{background:var(--alert-soft)}
.feedback.mid{background:var(--amber-soft)}
.feedback b{display:block;margin-bottom:2px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;font-size:18px}
.qcard .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;display:block}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-sign);font-weight:900;font-size:88px;line-height:.85;color:var(--teal);font-variant-numeric:tabular-nums}
.score span{font-family:var(--f-mono);font-size:16px;color:var(--muted)}
.code{width:100%;min-height:96px;font-family:var(--f-mono);font-size:13px;border:1.5px solid var(--line);border-radius:8px;padding:10px;background:var(--band);color:var(--ink);resize:none}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.parts li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.parts li:last-child{border-bottom:0}
.parts .n{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabs button{appearance:none;border:0;background:transparent;padding:6px 1px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);min-width:0}
.tabs button b{font-family:var(--f-sign);font-weight:900;font-size:20px;line-height:1}
.tabs button span{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs button.on{color:var(--teal);background:var(--teal-soft)}
.tabs button.done b::after{content:"✓";font-size:12px;margin-left:2px}

.peek{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;width:min(92vw,520px);display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">Plantão Santa Clara<small>Pronto-atendimento · sistemas integrados</small></div>
  <div class="clock" id="clock" hidden>00:00</div>
</div></header>

<main>
  <section class="view" id="v-inicio"></section>
  <section class="view" id="v-t1" hidden></section>
  <section class="view" id="v-t2" hidden></section>
  <section class="view" id="v-t3" hidden></section>
  <section class="view" id="v-dx" hidden></section>
  <section class="view" id="v-fim" hidden></section>
</main>

<nav class="tabs" aria-label="Etapas"><div class="tabs-in">
  <button data-tab="inicio"><b>0</b><span>Início</span></button>
  <button data-tab="t1"><b>1A</b><span>Fichas</span></button>
  <button data-tab="t2"><b>1B</b><span>Pontes</span></button>
  <button data-tab="t3"><b>2</b><span>Prontuário</span></button>
  <button data-tab="dx"><b>3</b><span>Casos</span></button>
  <button data-tab="fim"><b>4</b><span>Placar</span></button>
</div></nav>

<div id="modal-root"></div>

<script>

 {id:"004814",leito:"Maca 2",nome:"Ana Lúcia Ferreira",nasc:"21/07/1999",alergia:"Nenhuma",late:"Penicilina",allergen:"Penicilina",presc:"Amoxicilina 500 mg (uma penicilina)",bloq:true,
  o:{nome:["Ana Lúcia Ferreira","Ana Luiza Ferreira","Ana Lúcia Pereira"],nasc:["21/07/1999","27/01/1999","21/07/1990"],alergia:["Nenhuma","Penicilina","Dipirona"]}},

 {id:"004816",leito:"Maca 5",nome:"Antônio Bispo dos Reis",nasc:"30/01/1968",alergia:"Látex",presc:"Paracetamol 750 mg",bloq:false,
  o:{nome:["Antônio Bispo dos Reis","Antônio Bispo Reis","Antônio dos Reis Bispo"],nasc:["30/01/1968","03/10/1968","30/01/1986"],alergia:["Látex","Nenhuma","Iodo"]}}
];
const NASC2="12/08/1987";
const who=k=>P[k].nome.split(" ")[0]+(k===1?" Carlos (1952)":k===3?" Carlos (1990)":"");
const SEC={R:"Recepção",T:"Triagem",L:"Laboratório",F:"Farmácia",B:"Faturamento"};

const ORD="RTLFB";

const FLOWS1=[{a:"R",b:"T",d:"Cadastro do paciente"},{a:"R",b:"L",d:"Cadastro para etiquetar o tubo"},{a:"R",b:"F",d:"Cadastro para entregar o remédio"},{a:"T",b:"F",d:"Alergia descoberta na triagem"},{a:"L",b:"F",d:"Resultado de exame"}];

const COST=10000,REPAIR=4000,UPKEEP=1500;

const ITEMS=[

function newT2(){S.t2={ph:"brief1",links:{},fresh:{},broken:{},rep:{},cash:50000,spent:0,runs:{}};S.r2=null;render();window.scrollTo(0,0)}
function nodesOf(t){return ["build3","run3"].includes(t.ph)||t.ph==="brief3"?"RTLFB":"RTLF"}
function isActive(t,k){return t.links[k]&&!t.broken[k]}
function route(t,a,b,nodes){
  const prev={[a]:null},q=[a];
  while(q.length){const x=q.shift();if(x===b)break;
    for(const y of nodes)if(y!==x&&!(y in prev)&&isActive(t,pk(x,y))){prev[y]=x;q.push(y)}}
  if(!(b in prev))return null;
  const path=[];for(let x=b;x!==null;x=prev[x])path.unshift(x);return path;
}
function runFlows(t,flows,nodes){return flows.map(f=>{const p=route(t,f.a,f.b,nodes);return{...f,st:!p?"fa":p.length===2?"ok":"at",via:p?p.slice(1,-1):[]}})}
function netSVG(t,nodes){
  const n=nodes.length,cx=160,cy=150,R=108;
  const pos={};[...nodes].forEach((s,k)=>{const a=-Math.PI/2+k*2*Math.PI/n;pos[s]=[cx+R*Math.cos(a),cy+R*Math.sin(a)]});
  let lines="";
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=nodes[i],b=nodes[j],k=pk(a,b),[x1,y1]=pos[a],[x2,y2]=pos[b];
    if(t.links[k]&&t.broken[k])lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--alert)" stroke-width="3" stroke-dasharray="6 5"/>`;
    else if(t.links[k])lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--teal)" stroke-width="3.5"/>`;
    else lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="2 5"/>`;}
  const nd=[...nodes].map(s=>{const[x,y]=pos[s];return `<g><rect x="${x-26}" y="${y-18}" width="52" height="36" rx="7" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
    <text x="${x}" y="${y+5}" text-anchor="middle" font-family="Martian Mono,monospace" font-size="13" font-weight="600" fill="var(--ink)">${ABR[s]}</text>
    <rect x="${x-7}" y="${y+21}" width="14" height="7" rx="2" fill="var(--amber)"/></g>`}).join("");
  return `<div class="netwrap"><svg class="net" viewBox="0 0 320 300" role="img" aria-label="Mapa das interfaces entre os setores">${lines}${nd}</svg></div>`;
}
function pairBtn(t,k,mode){
  const [a,b]=k.split(""),on=!!t.links[k],locked=mode==="build3"&&on&&!t.fresh[k];
  const price=locked?"já existe":on?"ligada":"R$ 10 mil";

function modalT3(){
  if(S.t3&&S.t3.modal==="corr")return `<div class="modal"><div class="sheet"><div class="phone">PRONTUÁRIO · ATUALIZAÇÃO</div>
    <h3>A data da Maria Aparecida foi corrigida</h3>
    <p>A recepção alterou para <b style="font-family:var(--f-mono)">${NASC2}</b>. Laboratório e farmácia já veem a data nova. Não existe outra cópia para atualizar, e ninguém precisou ir até lá.</p>
    <button class="btn" onclick="S.t3.modal=null;S.t3.i++;S.t3.stage='reg';render()">Seguir o plantão</button></div></div>`;
  return "";
}
function finish3(){
  const t=S.t3,R={t:elapsed(t),campos:15+(t.late?1:0),div:0,ev:0,cham:0,labFail:0,issues:[],permOK:0,plan:t.plan};
  ITEMS.forEach(it=>"RTLFB".split("").forEach(s=>{if(it.ok[s].includes(t.perm[it.k][s]))R.permOK++}));
  P.forEach((p,k)=>{
    const r=t.raw[k];
    [["o nome",r.nome,p.nome],["o nascimento",r.nasc,p.nasc],["a alergia",r.alergia,p.alergia]].forEach(([f,v,tr])=>{if(v!==tr){R.div++;R.issues.push({c:"div",h:`Você registrou ${f} de ${esc(who(k))} como <b>${esc(v)}</b>. O erro apareceu igual em todas as telas. Uma correção na recepção resolveria para todos.`})}});
    const ok=p.bloq?"bloquear":"liberar";
    if(t.dec[k]!==ok){
      if(p.bloq){R.ev++;let why;
        if(k===2)why=!can(t,"ale","T","E")?"a triagem não podia editar alergias, e a informação ficou num papel":!t.late?"a alergia contada na triagem não foi registrada":!can(t,"ale","F","V")?"a farmácia não tinha acesso às alergias":"o alerta apareceu, mas o remédio foi liberado";
        else why=t.raw[3].alergia!=="Iodo"?"a alergia foi registrada errada na recepção":!can(t,"ale","F","V")?"a farmácia não tinha acesso às alergias":"o alerta apareceu, mas o remédio foi liberado";
        R.issues.push({c:"ev",h:`<b>Evento adverso:</b> ${esc(who(k))} recebeu ${p.presc}. Motivo: ${why}.`})}
      else{R.cham++;R.issues.push({c:"div",h:`${esc(who(k))} ficou sem ${p.presc} e o médico foi chamado sem necessidade.`})}
    }
  });
  if(!can(t,"res","L","E")){R.labFail=1;R.issues.push({c:"ev",h:`O potássio alto do José Carlos de 1990 não entrou no prontuário: o laboratório não tinha permissão para lançar resultados.`})}
  const planPts={cont:6,sheet:2,wait:0}[t.plan]||0;
  R.score=clamp(Math.round(R.permOK/20*12)+planPts+Math.max(0,12-6*R.ev-2*R.div-2*R.cham-3*R.labFail));
  S.r3=R;S.t3=null;render();window.scrollTo(0,0);
}
function resT3(){
  const R=S.r3,A=S.r1;
  return `<div class="eyebrow">Fim da Parte 2 · ${R.score} de 30 pontos</div>
  <h2>Os setores continuam lá. A segunda cópia, não</h2>
  <div class="stats">
    <div class="stat"><b>${fmt(R.t)}</b><span>tempo do plantão${A?` (Parte 1A: ${fmt(A.t)})`:""}</span></div>
    <div class="stat good"><b>${R.campos}</b><span>campos digitados${A?` (Parte 1A: ${A.campos})`:""}</span></div>
    <div class="stat ${R.permOK>=16?"good":"warn"}"><b>${R.permOK}/20</b><span>permissões certas</span></div>
    <div class="stat ${R.ev+R.labFail?"bad":"good"}"><b>${R.ev+R.labFail}</b><span>eventos adversos</span></div>
  </div>
  <ul class="issues">${R.issues.length?R.issues.map(x=>`<li class="${x.c==="ev"?"":"div"}">${x.h}</li>`).join(""):`<li class="ok">Nenhum erro de registro e nenhum evento adverso.</li>`}</ul>
  <div class="card stack small"><p>Cada setor manteve a sua tela, a sua rotina e a sua permissão. Ninguém foi demitido. O que acabou foi a ficha duplicada.</p>
  <p>Em troca, vieram novas responsabilidades: <b>quem registra, registra para todos</b> (um erro na origem chega a todas as telas), <b>quem vê o quê</b> precisa ser decidido, e <b>se a base cai, todos caem juntos</b>.</p></div>
  <button class="btn" onclick="go('dx')">Ir para os Casos</button>
  <button class="btn ghost" onclick="newT3()">Refazer a Parte 2</button>`;
}

/* ================= casos ================= */
function vDx(){
  const z=S.dx;
  if(z.i>=DX.length)return `<div class="eyebrow">Fim dos casos</div><h2>${z.score} de ${DX.length} diagnósticos certos</h2>
    <div class="card small">Os quatro sintomas de quem não é integrado: <b>dado duplicado, retrabalho, várias versões da verdade e decisão cega</b>.</div>
    <button class="btn" onclick="go('fim')">Ver o placar</button>
    <button class="btn ghost" onclick="S.dx={i:0,ans:null,score:0};render()">Refazer os casos</button>`;
  const q=DX[z.i];
  return `<div class="meta"><span>Qual é o sintoma?</span><span>${z.i+1} de ${DX.length}</span></div>${steps(DX.length,z.i)}
  <div class="qcard"><span class="tag">${q.t.toUpperCase()}</span>${q.s}</div>
  <div class="opts">${DXO.map((o,k)=>`<button class="opt body ${z.ans===k?"sel":""}" ${z.ans!==null?"disabled":""} onclick="ansDx(${k})">${o}</button>`).join("")}</div>
  ${z.ans!==null?`<div class="feedback ${z.ans===q.a?"ok":"no"}"><b>${z.ans===q.a?"Certo.":"Não é bem isso."}</b>${q.e}</div>
  <button class="btn" onclick="S.dx.i++;S.dx.ans=null;render();scrollTo(0,0)">${z.i<DX.length-1?"Próximo caso":"Terminar"}</button>`:""}`;
}
function ansDx(k){const z=S.dx;if(z.ans!==null)return;z.ans=k;if(k===DX[z.i].a)z.score++;render()}

/* ================= placar ================= */
function vFim(){
  const r1=S.r1,r2=S.r2,r3=S.r3,dxDone=S.dx.i>=DX.length,dxPts=dxDone?S.dx.score*2:0,finPts=S.fin?6:0;
  const total=(r1?r1.score:0)+(r2?r2.score:0)+(r3?r3.score:0)+dxPts+finPts;
  const parts=[["Parte 1A · Fichas",r1?r1.score:null,30],["Parte 1B · Pontes",r2?r2.score:null,20],["Parte 2 · Prontuário",r3?r3.score:null,30],["Casos",dxDone?dxPts:null,14],["Pergunta final",S.fin===null?null:finPts,6]];
  const pending=parts.filter(p=>p[1]===null).length;
  const code=`Plantão Santa Clara · ${total}/100\nP1A: ${r1?fmt(r1.t)+", "+r1.div+" divergências, "+r1.ev+" eventos":"não feito"}\nP1B: ${r2?r2.built+" interfaces, "+brl(r2.spent)+", "+r2.c.fa+" dados sem chegar":"não feito"}\nP2: ${r3?fmt(r3.t)+", permissões "+r3.permOK+"/20, "+(r3.ev+r3.labFail)+" eventos":"não feito"}\nCasos: ${dxDone?S.dx.score+"/"+DX.length:"não feito"}`;
  return `<div class="eyebrow">Placar do plantão</div>
  <div class="score"><b>${total}</b><span>de 100</span></div>
  ${pending?`<p class="muted small">Falta(m) ${pending} parte(s). Os pontos delas entram quando você terminar.</p>`:""}
  <div class="card"><ul class="parts">${parts.map(([n,v,m])=>`<li><span>${n}</span><span class="n">${v===null?"—":v} / ${m}</span></li>`).join("")}</ul></div>
  ${r1&&r3?`<div class="tablewrap"><table class="cmp"><thead><tr><th></th><th class="n">Sem sistema</th><th class="n">Com sistema</th></tr></thead><tbody>
    <tr><td>Tempo</td><td class="n">${fmt(r1.t)}</td><td class="n">${fmt(r3.t)}</td></tr>
    <tr><td>Campos digitados</td><td class="n">${r1.campos}</td><td class="n">${r3.campos}</td></tr>
    <tr><td>Dados divergentes entre setores</td><td class="n">${r1.div}</td><td class="n">0</td></tr>
    <tr><td>Eventos adversos</td><td class="n">${r1.ev}</td><td class="n">${r3.ev+r3.labFail}</td></tr>
    <tr><td>Correção chegou a todos</td><td class="n">${r1.issues.some(x=>x.h.includes(NASC2))?"Não":"Sim, a pé"}</td><td class="n">Sim</td></tr>
  </tbody></table></div>`:""}
  <div class="eyebrow" style="margin-top:6px">Pergunta final</div>
  <h3>${FINAL.q}</h3>
  ${S.fin===null?`<div class="opts">${FINAL.o.map(o=>`<button class="opt body" onclick="S.fin=${o[1]};render()">${o[0]}</button>`).join("")}</div>`
  :`<div class="feedback ${S.fin?"ok":"no"}"><b>${S.fin?"Certo.":"Não é bem isso."}</b>${FINAL.e}</div>`}
  <div class="card"><p style="font-size:18px"><b>Para levar:</b> quando um dado é registrado, quem mais no hospital precisa saber, e fica sabendo sem que ninguém digite de novo?</p></div>
  <div class="eyebrow" style="margin-top:6px">Seu código para o Classroom</div>
  <textarea id="code" class="code" readonly>${esc(code)}</textarea>
  <button class="btn" id="copybtn" onclick="copyCode()">Copiar código</button>
  ${UI.reset?`<div class="feedback no"><b>Apagar todo o progresso?</b>Isso zera as duas partes, os casos e o placar.</div>
    <div class="row"><button class="btn danger" onclick="resetAll()">Apagar e recomeçar</button><button class="btn ghost" onclick="UI.reset=false;render()">Cancelar</button></div>`
  :`<button class="btn ghost" onclick="UI.reset=true;render()">Recomeçar tudo</button>`}`;
}
function copyCode(){
  const ta=$("#code"),b=$("#copybtn"),done=()=>{b.textContent="Copiado";setTimeout(()=>{if(b.isConnected)b.textContent="Copiar código"},1800)};
  const fallback=()=>{ta.focus();ta.select();try{document.execCommand("copy");done()}catch(e){b.textContent="Selecionado: copie manualmente"}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done,fallback);else fallback();
}
function resetAll(){const n=S.net;S=DEF();S.net=n;UI.reset=false;S.tab="inicio";render();window.scrollTo(0,0)}

/* ================= render ================= */
function render(){
  const m={inicio:vInicio,t1:vT1,t2:vT2,t3:vT3,dx:vDx,fim:vFim};
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+S.tab);
  $("#v-"+S.tab).innerHTML=m[S.tab]();
  $("#modal-root").innerHTML=S.tab==="t1"&&S.t1?modalT1():S.tab==="t3"?modalT3():"";
  marks();save();
}
render();
</script>

</body>
</html>
